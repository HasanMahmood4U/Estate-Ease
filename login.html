 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/login.css">
  <title>Estate-Ease</title>

  
</head>

<body>

  <div class="login-container">

    <!-- Property Image -->
    <div class="login-image">
      <h1>Find Your Dream Home</h1>
      <p>
        Discover beautiful properties and find the perfect place
        to call home with Estate-Ease.
      </p>
    </div>

    <!-- Login Form -->
    <div class="login-form">
    <div class="login-back"><a href="index.html" class="login-back">Back</a></div>

      <div class="logo">Estate-Ease</div>

      <h2>Welcome Back</h2>
      <p class="subtitle">Login to manage your properties and account.</p>

      <form onsubmit="login(event)">

        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          >
        </div>

        <div class="options">
          <label class="remember">
            <input type="checkbox">
            Remember me
          </label>

          <a href="#" class="forgot">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">
          Login
        </button>

      </form>

      <div class="divider">OR</div>

      <p class="signup">
        Don't have an account?
        <a href="#">Create Account</a>
      </p>

    </div>
  </div>

 
<script src="js/login.js"></script>
</body>
</html>
