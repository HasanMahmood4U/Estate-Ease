<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Estate-Ease</title>

    <link
        rel="stylesheet"
        href="css/login.css"
    >

</head>


<body>


    <div class="login-container">
        
        <div class="login-card">
            <a href="index.html" class="back-link">
            &larr; Back
        </a>



            <!-- LOGO -->

            <div class="logo">

                <span>Estate</span>
                <b>-Ease</b>

            </div>


            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to continue to Estate-Ease
            </p>


            <!-- AUTO ACCOUNT INFO -->

            <div class="auto-account-info">

                <strong>New user?</strong>

                Just enter your email and password.
                Your Estate-Ease account will be created automatically.

            </div>


            <!-- LOGIN FORM -->

            <form
                id="loginForm"
                onsubmit="login(event)"
            >


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- REMEMBER -->

                <div class="login-options">


                    <label class="remember-box">

                        <input
                            type="checkbox"
                            id="remember"
                            checked
                        >

                        <span>
                            Remember me
                        </span>

                    </label>


                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-btn"
                >

                    Login

                </button>


            </form>


            <p
                id="loginMessage"
                class="login-message"
            ></p>


        </div>

    </div>


    <script src="js/login.js"></script>


</body>

</html>
