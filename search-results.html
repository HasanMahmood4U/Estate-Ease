    <!-- ================= HEADER ================= -->

    <section class="header">

        <h1>
            Search Results
        </h1>


        <p>

            Properties found for:

            <span id="searchText"></span>

        </p>

    </section>



    <!-- ================= SEARCH AGAIN ================= -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search city or locality..."
        >


        <button onclick="performSearch()">

            🔍 Search

        </button>

    </div>



    <!-- ================= RESULT COUNT ================= -->

    <div
        class="result-info"
        id="resultInfo"
    ></div>



    <!-- ================= PROPERTY CONTAINER ================= -->

        class="property-container"
        id="propertyContainer"
    ></div>



    <!-- =====================================================
         PROPERTY POPUP
    ===================================================== -->

    <div
        class="property-modal"
        id="propertyModal"
    >

        <div class="modal-content">


            <!-- CLOSE -->

            <button
                class="close-btn"
                onclick="closePropertyModal()"
            >
                ×
            </button>



            <!-- IMAGE -->

            <img
                id="modalImage"
                src=""
                alt="Property"
            >



            <!-- TITLE -->

            <h2 id="modalTitle"></h2>



            <!-- BRAND -->

            <div
                class="modal-brand"
                id="modalBrand"
            ></div>



            <!-- LOCATION -->

            <div
                class="modal-location"
                id="modalLocation"
            ></div>



            <!-- DETAILS -->

            <div
                class="modal-details"
                id="modalDetails"
            ></div>



            <!-- PRICE -->

            <div
                class="modal-price"
                id="modalPrice"
            ></div>



            <!-- DESCRIPTION -->

            <p
                class="modal-description"
                id="modalDescription"
            ></p>



            <!-- ================= OWNER ================= -->

            <div class="owner-info">

                <h3>
                    👤 Property Owner
                </h3>


                <p>

                    <strong>Name:</strong>

                    <span id="modalOwnerName"></span>

                </p>


                <p>

                    <strong>Phone:</strong>

                    <span id="modalOwnerPhone"></span>

                </p>


                <a
                    id="callOwnerBtn"
                    href="#"
                    class="contact-owner-btn"
                >

                    📞 Call Owner

                </a>

            </div>



            <!-- ================= BOOKING ================= -->

            <div class="booking-section">

                <h3>
                    📅 Book Property
                </h3>


                <label>
                    Select Date
                </label>


                <input
                    type="date"
                    id="bookingDate"
                >


                <button
                    class="booking-btn"
                    onclick="bookProperty()"
                >

                    📅 Book Now

                </button>


                <button
                    class="payment-btn"
                    onclick="makePayment()"
                >

                    💳 Proceed to Payment

                </button>

            </div>


        </div>

    </div>

            },


            {
                title: "Prime Retail Avenue",
                brand: "PrimeLand Realty",
                type: "Commercial",

                location: "Andheri West, Mumbai",
                area: "1100 sqft",

                image:
                    "https://images.unsplash.com/photo-1441986300917-64674bd600d8?auto=format&fit=crop&w=900&q=80",

                ownerName: "Karan Mehta",
                ownerPhone: "9876123456",

                description:
                    "Ground-floor retail shop in Andheri West, Mumbai suitable for commercial use."
            }

        ];



        /* =========================================
           CURRENT SEARCH RESULTS
        ========================================= */

        let currentResults = [];

        let selectedProperty = null;



        /* =========================================
           GET SEARCH FROM URL
        ========================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        let currentSearch =
            urlParams.get("location") || "";



        /* =========================================
           DISPLAY RESULTS
        ========================================= */

        function showResults(searchValue) {


            const query =
                searchValue
                    .toLowerCase()
                    .trim();


            document.getElementById(
                "searchText"
            ).innerText =
                searchValue || "All Properties";


            document.getElementById(
                "searchInput"
            ).value =
                searchValue;



            /* ================================
               SEARCH EVERYTHING
            ================================= */

            const results =
                allProperties.filter(property => {


                    const searchableText = (

                        property.title + " " +

                        property.brand + " " +

                        property.type + " " +

                        property.purpose + " " +

                        property.location + " " +

                        property.area + " " +

                        property.details

                    ).toLowerCase();


                    return searchableText
                        .includes(query);

                });



            /* SAVE CURRENT RESULTS */

            currentResults = results;



            document.getElementById(
                "resultInfo"
            ).innerText =
                results.length +
                " properties found";



            renderResults(results);

        }



        /* =========================================
           RENDER RESULTS
        ========================================= */

        function renderResults(results) {


            const container =
                document.getElementById(
                    "propertyContainer"
                );


            container.innerHTML = "";



            if (results.length === 0) {


                container.innerHTML = `

                    <div class="no-result">

                        <h2>
                            No Property Found
                        </h2>

                        <p>
                            Try another city,
                            locality or property name.
                        </p>

                    </div>

                `;


                return;

            }



            results.forEach((property, index) => {


                container.innerHTML += `

                    <div
                        class="property-card"
                        onclick="openPropertyPopup(${index})"
                    >

                        <img
                            class="property-image"
                            src="${property.image}"
                            alt="${property.title}"
                        >


                        <div class="card-content">


                            <span class="type">

                                ${property.purpose}
                                •
                                ${property.type}

                            </span>


                            <h2>

                                ${property.title}

                            </h2>


                            <div class="brand">

                                ${property.brand}

                            </div>


                            <div class="location">

                                📍
                                ${property.location}

                            </div>


                            <div class="details">

                                <span>

                                    📐 ${property.area}

                                </span>


                                <span>

                                    ${property.details}

                                </span>

                            </div>


                            <div class="price">

                                ${property.price}

                            </div>


                            <button
                                class="view-btn"
                                onclick="
                                    event.stopPropagation();
                                    openPropertyPopup(${index});
                                "
                            >

                                View Details

                            </button>


                        </div>

                    </div>

                `;

            });

        }



        /* =========================================
           OPEN DIRECT PROPERTY POPUP
        ========================================= */

        function openPropertyPopup(index) {


            /* Get selected property */

            selectedProperty =
                currentResults[index];



            if (!selectedProperty) {

                return;

            }



            /* =========================
               SET IMAGE
            ========================= */

            document.getElementById(
                "modalImage"
            ).src =
                selectedProperty.image;



            /* =========================
               SET TITLE
            ========================= */

            document.getElementById(
                "modalTitle"
            ).innerText =
                selectedProperty.title;



            /* =========================
               SET BRAND
            ========================= */

            document.getElementById(
                "modalBrand"
            ).innerText =
                selectedProperty.brand;



            /* =========================
               SET LOCATION
            ========================= */

            document.getElementById(
                "modalLocation"
            ).innerText =
                "📍 " +
                selectedProperty.location;



            /* =========================
               SET DETAILS
            ========================= */

            document.getElementById(
                "modalDetails"
            ).innerHTML = `

                <span>
                    ${selectedProperty.purpose}
                </span>

                <span>
                    ${selectedProperty.type}
                </span>

                <span>
                    📐 ${selectedProperty.area}
                </span>

                <span>
                    ${selectedProperty.details}
                </span>

            `;



            /* =========================
               SET PRICE
            ========================= */

            document.getElementById(
                "modalPrice"
            ).innerText =
                selectedProperty.price;



            /* =========================
               SET DESCRIPTION
            ========================= */

            document.getElementById(
                "modalDescription"
            ).innerText =
                selectedProperty.description;



            /* =========================
               OWNER NAME
            ========================= */

            document.getElementById(
                "modalOwnerName"
            ).innerText =
                selectedProperty.ownerName;



            /* =========================
               OWNER PHONE
            ========================= */

            document.getElementById(
                "modalOwnerPhone"
            ).innerText =
                selectedProperty.ownerPhone;



            /* =========================
               CALL OWNER
            ========================= */

            document.getElementById(
                "callOwnerBtn"
            ).href =
                "tel:" +
                selectedProperty.ownerPhone;



            /* =========================
               CLEAR BOOKING DATE
            ========================= */

            document.getElementById(
                "bookingDate"
            ).value = "";



            /* =========================
               SHOW POPUP
            ========================= */

            document.getElementById(
                "propertyModal"
            ).style.display =
                "flex";


            /* Prevent background scrolling */

            document.body.style.overflow =
                "hidden";

        }



        /* =========================================
           CLOSE POPUP
        ========================================= */

        function closePropertyModal() {


            document.getElementById(
                "propertyModal"
            ).style.display =
                "none";


            /* Enable page scrolling */

            document.body.style.overflow =
                "auto";

        }



        /* =========================================
           CLOSE POPUP WHEN CLICKING OUTSIDE
        ========================================= */

        document.getElementById(
            "propertyModal"
        ).addEventListener(
            "click",
            function(event) {


                if (
                    event.target ===
                    this
                ) {

                    closePropertyModal();

                }

            }
        );



        /* =========================================
           ESC KEY CLOSE
        ========================================= */

        document.addEventListener(
            "keydown",
            function(event) {


                if (
                    event.key === "Escape"
                ) {

                    closePropertyModal();

                }

            }
        );



        /* =========================================
           BOOK PROPERTY
        ========================================= */

        function bookProperty() {


            const date =
                document.getElementById(
                    "bookingDate"
                ).value;



            if (!date) {

                alert(
                    "Please select a booking date."
                );

                return;

            }



            if (!selectedProperty) {

                return;

            }



            alert(

                "Booking request submitted for " +

                selectedProperty.title +

                " on " +

                date +

                "."

            );

        }



        /* =========================================
           PAYMENT
        ========================================= */

        function makePayment() {


            if (!selectedProperty) {

                return;

            }



            alert(

                "Payment option selected for " +

                selectedProperty.title +

                "."

            );

        }



        /* =========================================
           SEARCH AGAIN
        ========================================= */

        function performSearch() {


            const value =
                document.getElementById(
                    "searchInput"
                ).value.trim();



            if (value === "") {

                alert(
                    "Please enter a location."
                );

                return;

            }



            const newURL =
                "search-results.html?location=" +
                encodeURIComponent(value);



            window.location.href =
                newURL;

        }



        /* =========================================
           ENTER KEY
        ========================================= */

        document.getElementById(
            "searchInput"
        ).addEventListener(
            "keypress",
            function(event) {


                if (
                    event.key === "Enter"
                ) {

                    performSearch();

                }

            }
        );



        /* =========================================
           INITIAL LOAD
        ========================================= */

        showResults(currentSearch);

    </script>
