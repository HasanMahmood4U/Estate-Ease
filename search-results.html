<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <link rel="stylesheet" href="css/search-results.css">

    <title>Search Results - Estate-Ease</title>


  

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav>

        <div class="logo">
            Estate<span>-Ease</span>
        </div>


        <div>

            <a href="index.html">
                Home
            </a>

            <a href="index.html#featured-properties">
                Properties
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#about">
                About Us
            </a>

            <a href="index.html#contact">
                Contact
            </a>

        </div>

    </nav>



    <!-- ================= HEADER ================= -->

    <section class="header">

        <h1>
            Search Results
        </h1>


        <p>

            Properties found for:

            <span id="searchText"></span>

        </p>

    </section>



    <!-- ================= SEARCH AGAIN ================= -->

    <div class="search-box">

        <input
            type="text"
            id="searchInput"
            placeholder="Search city or locality..."
        >


        <button onclick="performSearch()">

            🔍 Search

        </button>

    </div>



    <!-- ================= RESULT COUNT ================= -->

    <div
        class="result-info"
        id="resultInfo"
    ></div>



    <!-- ================= PROPERTY CONTAINER ================= -->

    <div
        class="property-container"
        id="propertyContainer"
    ></div>



    <!-- =====================================================
         PROPERTY POPUP
    ===================================================== -->

    <div
        class="property-modal"
        id="propertyModal"
    >

        <div class="modal-content">


            <!-- CLOSE -->

            <button
                class="close-btn"
                onclick="closePropertyModal()"
            >
                ×
            </button>



            <!-- IMAGE -->

            <img
                id="modalImage"
                src=""
                alt="Property"
            >



            <!-- TITLE -->

            <h2 id="modalTitle"></h2>



            <!-- BRAND -->

            <div
                class="modal-brand"
                id="modalBrand"
            ></div>



            <!-- LOCATION -->

            <div
                class="modal-location"
                id="modalLocation"
            ></div>



            <!-- DETAILS -->

            <div
                class="modal-details"
                id="modalDetails"
            ></div>



            <!-- PRICE -->

            <div
                class="modal-price"
                id="modalPrice"
            ></div>



            <!-- DESCRIPTION -->

            <p
                class="modal-description"
                id="modalDescription"
            ></p>



            <!-- ================= OWNER ================= -->

            <div class="owner-info">

                <h3>
                    👤 Property Owner
                </h3>


                <p>

                    <strong>Name:</strong>

                    <span id="modalOwnerName"></span>

                </p>


                <p>

                    <strong>Phone:</strong>

                    <span id="modalOwnerPhone"></span>

                </p>


                <a
                    id="callOwnerBtn"
                    href="#"
                    class="contact-owner-btn"
                >

                    📞 Call Owner

                </a>

            </div>



            <!-- ================= BOOKING ================= -->

            <div class="booking-section">

                <h3>
                    📅 Book Property
                </h3>


                <label>
                    Select Date
                </label>


                <input
                    type="date"
                    id="bookingDate"
                >


                <button
                    class="booking-btn"
                    onclick="bookProperty()"
                >

                    📅 Book Now

                </button>


                <button
                    class="payment-btn"
                    onclick="makePayment()"
                >

                    💳 Proceed to Payment

                </button>

            </div>


        </div>

    </div>

 
<script src="js/search-results.js"></script>
</body>

</html>
